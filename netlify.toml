# Netlify config. Keeps the secrets scanner from flagging the two
# Supabase public keys — they are designed to ship in the browser
# bundle (Supabase RLS + the custom JWT are the actual gate).
[build.environment]
  # NEXT_PUBLIC_SUPABASE_URL holds the same value as SUPABASE_URL, so
  # the scanner finds the URL in the bundle and double-flags it under
  # the server-only name. Add both to the omit list.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_URL"
